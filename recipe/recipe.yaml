schema_version: 1

context:
  version: "4.4.3"

package:
  name: django-import-export
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/d/django-import-export/django_import_export-${{ version }}.tar.gz
  sha256: 2024e6e64ecb2cbd9835bbbfbfe08bc31e9c7f6cc8923f3b9ab0ffdad0308c22

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=60
    - setuptools-scm >=7.1.0
    - pip
  run:
    - python >=${{ python_min }}
    - diff-match-patch ==20241021
    - django >=4.2
    - tablib >=3.7.0

tests:
  - python:
      imports:
        - import_export
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Django application and library for importing and exporting data with included admin integration.
  license: BSD-2-Clause
  license_file: LICENSE
  homepage: https://pypi.org/project/django-import-export/
  documentation: https://django-import-export.readthedocs.io/en/stable/

extra:
  recipe-maintainers:
    - ocefpaf
